apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mozip

resources:
- ../../base
- configmap.yaml
- ingress.yaml
- hpa.yaml

images:
- name: ghcr.io/mozip-project/mozip-api
  newName: ghcr.io/mozip-project/mozip-api
  newTag: 90a14a0d2d034eb05e41b0bb8b18e3f383e38b0b
- name: ghcr.io/mozip-project/mozip-worker
  newName: ghcr.io/mozip-project/mozip-worker
  newTag: 90a14a0d2d034eb05e41b0bb8b18e3f383e38b0b


patches:
- path: api-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-api
    version: v1
- path: worker-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-worker
    version: v1
