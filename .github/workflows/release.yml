name: Release

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'k8s/app/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          OWNER="${REPOSITORY%%/*}"
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${OWNER}/mozip-api" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${OWNER}/mozip-worker" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.api }}:${{ github.sha }}

      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.worker }}:${{ github.sha }}

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tags
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd k8s/app
          kustomize edit set image \
            "${API_IMAGE}=${API_IMAGE}:${IMAGE_TAG}" \
            "${WORKER_IMAGE}=${WORKER_IMAGE}:${IMAGE_TAG}"

      - name: Commit manifest update
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/app/kustomization.yaml
          git commit -m "chore: deploy ${IMAGE_TAG}" || exit 0
          git push
