apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mozip

resources:
- ../../base
- configmap.yaml
- ingress.yaml
- hpa.yaml

images:
- name: ghcr.io/mozip-project/mozip-api
  newName: ghcr.io/mozip-project/mozip-api
  newTag: 03359dabbd6c899208e8a7c32d5c1d70d6083b2e
- name: ghcr.io/mozip-project/mozip-worker
  newName: ghcr.io/mozip-project/mozip-worker
  newTag: 03359dabbd6c899208e8a7c32d5c1d70d6083b2e


patches:
- path: api-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-api
    version: v1
- path: worker-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-worker
    version: v1
