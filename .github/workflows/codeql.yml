# Java 코드 보안 취약점 정적 분석, 결과는 Security 탭의 Code scanning에 표시
name: CodeQL

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    # 매주 월요일 03:00 KST
    - cron: '0 18 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 빌드 없이 소스만 분석
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
