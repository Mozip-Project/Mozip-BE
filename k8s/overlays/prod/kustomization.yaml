apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mozip

resources:
- ../../base
- configmap.yaml
- ingress.yaml
- hpa.yaml

images:
- name: ghcr.io/mozip-project/mozip-api
  newName: ghcr.io/mozip-project/mozip-api
  newTag: d4bdbb98dd3d166b50c1dedd434092407573e53d

patches:
  - path: api-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: mozip-api

  - path: worker-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: mozip-worker
