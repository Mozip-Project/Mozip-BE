plugins {
	id 'java-library'
	id 'java-test-fixtures'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// ErrorCode.getStatus()가 HttpStatus를 반환해 common 밖으로 노출되므로 api로 선언
	api 'org.springframework:spring-web'
	api 'org.springframework.boot:spring-boot-starter-data-jpa'
	api 'org.springframework.boot:spring-boot-starter-data-redis'
	api 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'org.postgresql:postgresql'

	// S3Presigner/S3Client가 common 밖(api)에서도 생성자 주입 타입으로 쓰이므로 api로 선언
	api platform('software.amazon.awssdk:bom:2.29.52')
	api 'software.amazon.awssdk:s3'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'

	testFixturesImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testFixturesImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testFixturesImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testFixturesImplementation 'org.testcontainers:testcontainers-postgresql'
}
