apiVersion: v1
kind: ConfigMap
metadata:
  name: mozip-config
  namespace: mozip-dev
data:
  SPRING_PROFILES_ACTIVE: "dev"
  REDIS_HOST: "10.0.2.10"
  REDIS_PORT: "6379"
  # 로컬 프론트(localhost:3000)로 dev API 테스트 중. 실제 dev 프론트 도메인이 생기면 교체 필요 (콤마로 여러 개 가능)
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
