# 로컬 개발 환경이며, compose.yaml 값과 맞춤
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mozip
    username: mozip
    password: mozip
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      # 로컬에서는 엔티티 기준으로 테이블 자동 생성 및 수정
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  graphql:
    graphiql:
      # GraphiQL(/graphiql)은 로컬, 개발 서버에서만 사용
      enabled: true

jwt:
  secret: local-only-mozip-jwt-secret-key-change-me-0123456789

auth:
  # 인증 우회 켜기: AUTH_BYPASS_ENABLED=true (설정은 application.yml)
  cookie:
    secure: false
  cors:
    allowed-origins: http://localhost:3000

logging:
  level:
    org.hibernate.SQL: debug
