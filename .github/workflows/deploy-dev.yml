name: Deploy Dev

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'k8s/overlays/**'

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/mozip-project
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # JAR 빌드, Docker 이미지 빌드 및 Push
  deploy:
    name: Build and Deploy Dev
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.images.outputs.api }}
      worker: ${{ steps.images.outputs.worker }}

    steps:
      # 1. GitHub App 토큰 발급 (보호된 develop 브랜치 push 권한)
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      # 2. GitHub 저장소 Checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      # 3. JDK 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. Gradle 설정
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 5. 테스트
      - name: Run Tests
        run: ./gradlew clean test

      # 6. API/Worker jar 빌드 (api, worker Dockerfile이 build/libs/app.jar를 COPY함)
      - name: Build jars
        run: ./gradlew :api:bootJar :worker:bootJar

      # 7. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. GHCR 로그인
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. 이미지 이름 결정
      - name: Set image names
        id: images
        run: |
          echo "api=${{ env.REGISTRY }}/mozip-api" >> "$GITHUB_OUTPUT"
          echo "worker=${{ env.REGISTRY }}/mozip-worker" >> "$GITHUB_OUTPUT"

      # 10. API 이미지 빌드 및 Push
      - name: Build and Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.api }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=dev-api
          cache-to: type=gha,mode=max,scope=dev-api

      # 11. Worker 이미지 빌드 및 Push
      - name: Build and Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.worker }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=dev-worker
          cache-to: type=gha,mode=max,scope=dev-worker
  # Kubernetes Manifest 갱신
  update-manifest:
    name: Update Dev Manifest
    needs: deploy
    runs-on: ubuntu-latest

    # Prod의 update-manifest와 동일한 그룹명 사용
    concurrency:
      group: develop-manifest-update
      cancel-in-progress: false

    steps:
      # 12. GitHub App 토큰 발급 (보호된 develop 브랜치 push 권한)
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      # 13. GitHub 저장소 Checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      # 14. Kustomize 버전 확인
      - name: Check Kustomize
        run: kustomize version

      # 15. 개발 환경 이미지 태그 갱신
      - name: Update Dev Image Tags
        working-directory: k8s/overlays/dev
        env:
          API_IMAGE: ${{ needs.deploy.outputs.api }}
          WORKER_IMAGE: ${{ needs.deploy.outputs.worker }}
        run: |
          kustomize edit set image "${API_IMAGE}=${API_IMAGE}:${IMAGE_TAG}"
          kustomize edit set image "${WORKER_IMAGE}=${WORKER_IMAGE}:${IMAGE_TAG}"

      # 16. 변경 사항 Git Push
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update dev image tag to ${IMAGE_TAG}"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
