# 1. Namespace 생성
#  kubectl create namespace mozip-dev
#
# 2. GHCR 이미지 Pull 인증 Secret 생성
# 기존 운영 환경에서 사용 중인 GitHub 계정 및 PAT를 재사용할 수 있다.
# (PAT는 read:packages 권한 필요)
#
# kubectl create secret docker-registry ghcr-secret -n mozip-dev \
#   --docker-server=ghcr.io \
#   --docker-username=<GITHUB_USERNAME> \
#   --docker-password=<GITHUB_PAT>
#
# 3. 애플리케이션 환경변수 Secret 생성
# kubectl apply -f secret-dev.yaml
# 4. 생성 결과 확인
#  kubectl get secrets -n mozip-dev

apiVersion: v1
kind: Secret
metadata:
  name: mozip-secret
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://10.0.2.10:5432/mozip-dev"
  DB_USERNAME: "YOUR_DB_USERNAME"
  DB_PASSWORD: "YOUR_DB_PASSWORD"
  REDIS_PASSWORD: "YOUR_REDIS_PASSWORD"
  JWT_SECRET: "YOUR_JWT_SECRET"
  # mozip-dev-assets 버킷에만 접근 가능한 IAM 사용자 (운영과 분리된 별도 자격 증명)
  # SES도 같은 자격 증명을 씀 (worker의 SesMailSender). 이 사용자에 ses:SendEmail 권한 추가 필요
  AWS_ACCESS_KEY_ID: "YOUR_DEV_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "YOUR_DEV_AWS_SECRET_ACCESS_KEY"
