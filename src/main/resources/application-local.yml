# 로컬 개발 환경이며, compose.yaml 값과 맞춤
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mozip
    username: mozip
    password: mozip
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      # 로컬에서는 엔티티 기준으로 테이블 자동 생성 및 수정
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  graphql:
    graphiql:
      # GraphiQL(/graphiql)은 로컬에서만 사용
      enabled: true

logging:
  level:
    org.hibernate.SQL: debug
