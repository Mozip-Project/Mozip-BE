# 개발 서버 환경 (DB, Redis, JWT_SECRET, CORS_ALLOWED_ORIGINS 등 접속 정보는 환경변수로 주입)
# 인증 우회 켜기: AUTH_BYPASS_ENABLED=true (설정은 application.yml)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  graphql:
    graphiql:
      # 프론트가 브라우저에서 쿼리를 실행하고 스키마 문서를 볼 수 있게 GraphiQL(/graphiql) 사용
      enabled: true

graphql:
  # GraphiQL 자동완성, 프론트 codegen이 개발 서버 스키마를 사용하므로 허용 (기본값과 같지만 운영과 구분되게 명시)
  introspection-enabled: true
