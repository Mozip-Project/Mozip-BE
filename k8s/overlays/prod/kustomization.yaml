apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mozip

resources:
- ../../base
- configmap.yaml
- ingress.yaml
- hpa.yaml

images:
- name: ghcr.io/mozip-project/mozip-api
  newName: ghcr.io/mozip-project/mozip-api
  newTag: de65539d372d8bf6d7855d7cf57a1f51bca9be73
- name: ghcr.io/mozip-project/mozip-worker
  newName: ghcr.io/mozip-project/mozip-worker
  newTag: de65539d372d8bf6d7855d7cf57a1f51bca9be73


patches:
- path: api-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-api
    version: v1
- path: worker-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-worker
    version: v1
