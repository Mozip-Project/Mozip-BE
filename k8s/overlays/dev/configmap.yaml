apiVersion: v1
kind: ConfigMap
metadata:
  name: mozip-config
data:
  SPRING_PROFILES_ACTIVE: "dev"
  REDIS_HOST: "10.0.2.10"
  REDIS_PORT: "6380"
  # 로컬 프론트(localhost:3000)로 dev API 테스트 중. 실제 dev 프론트 도메인이 생기면 교체 필요 (콤마로 여러 개 가능)
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
  # dev에서는 로그인 없이 API 테스트하도록 인증 우회 기본 활성화 (X-Mock-Role 헤더로 역할 지정, 없으면 APPLICANT)
  AUTH_BYPASS_ENABLED: "true"
  # 운영과 분리된 dev 전용 버킷 (실제 버킷 이름으로 교체 필요)
  S3_BUCKET: "mozip-dev-assets"
  AWS_REGION: "ap-northeast-2"
  CDN_DOMAIN: "https://mozip-dev-assets.s3.ap-northeast-2.amazonaws.com"
  # 단체 생성 심사 디스코드 연동. 공개키와 허용 역할/사용자를 채운 뒤 true로 바꾼다 (봇 토큰은 mozip-secret의 DISCORD_BOT_TOKEN)
  DISCORD_ENABLED: "false"
  # 디스코드 개발자 콘솔 General Information의 Public Key. 비면 Interactions 요청은 전부 401
  DISCORD_PUBLIC_KEY: ""
  DISCORD_REVIEW_CHANNEL_ID: "1574977073104162938"
  # 승인/미승인 버튼을 누를 수 있는 역할 id와 사용자 id (콤마로 여러 개). 둘 다 비면 아무도 못 누른다
  DISCORD_ALLOWED_ROLE_IDS: ""
  DISCORD_ALLOWED_USER_IDS: ""
