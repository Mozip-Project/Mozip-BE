apiVersion: apps/v1
kind: Deployment
metadata:
  name: mozip-worker
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: mozip-worker
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
