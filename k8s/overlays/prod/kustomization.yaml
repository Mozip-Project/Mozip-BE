apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mozip

resources:
- ../../base
- configmap.yaml
- ingress.yaml
- hpa.yaml

images:
- name: ghcr.io/mozip-project/mozip-api
  newName: ghcr.io/mozip-project/mozip-api
  newTag: 9c9dc9d92f47b3e0ed913818bedcd443e91721f5
- name: ghcr.io/mozip-project/mozip-worker
  newName: ghcr.io/mozip-project/mozip-worker
  newTag: 9c9dc9d92f47b3e0ed913818bedcd443e91721f5


patches:
- path: api-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-api
    version: v1
- path: worker-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-worker
    version: v1
