apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mozip-dev

resources:
- ../../base
- configmap.yaml
- ingress.yaml
- hpa.yaml

patches:
  - path: api-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: mozip-api

  - path: worker-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: mozip-worker
