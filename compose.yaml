# 로컬 개발용 PostgreSQL(pgvector) + Redis
services:
  postgres:
    image: 'pgvector/pgvector:pg17'
    environment:
      - 'POSTGRES_DB=mozip'
      - 'POSTGRES_USER=mozip'
      - 'POSTGRES_PASSWORD=mozip'
      - 'TZ=Asia/Seoul'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
  redis:
    image: 'redis:7.4-alpine'
    ports:
      - '6379:6379'

volumes:
  postgres-data:
