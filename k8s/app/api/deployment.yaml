apiVersion: apps/v1
kind: Deployment
metadata:
  name: mozip-api
  namespace: mozip
spec:
  selector:
    matchLabels:
      app: mozip-api
  template:
    metadata:
      labels:
        app: mozip-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      nodeSelector:
        kubernetes.io/hostname: k8s-worker

      containers:
        - name: api
          image: ghcr.io/mozip-project/mozip-api:initial
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: mozip-config
            - secretRef:
                name: mozip-secret

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
