apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mozip

resources:
- ../../base
- configmap.yaml
- ingress.yaml
- hpa.yaml

images:
- name: ghcr.io/mozip-project/mozip-api
  newName: ghcr.io/mozip-project/mozip-api
  newTag: c6ad0c5a87f2ecd5a2e9632b7f8724d424de3c22
- name: ghcr.io/mozip-project/mozip-worker
  newName: ghcr.io/mozip-project/mozip-worker
  newTag: c6ad0c5a87f2ecd5a2e9632b7f8724d424de3c22


patches:
- path: api-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-api
    version: v1
- path: worker-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-worker
    version: v1
