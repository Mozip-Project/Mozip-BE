apiVersion: apps/v1
kind: Deployment
metadata:
  name: mozip-api
  labels:
    app: mozip-api
spec:
  selector:
    matchLabels:
      app: mozip-api
  template:
    metadata:
      labels:
        app: mozip-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      nodeSelector:
        kubernetes.io/hostname: k8s-worker

      containers:
        - name: mozip-api
          image: ghcr.io/mozip-project/mozip-api:initial
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: mozip-config
            - secretRef:
                name: mozip-secret

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          terminationMessagePolicy: File
