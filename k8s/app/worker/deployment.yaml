apiVersion: apps/v1
kind: Deployment
metadata:
  name: mozip-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mozip-worker
  template:
    metadata:
      labels:
        app: mozip-worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker

      containers:
        - name: worker
          image: ghcr.io/mozip-project/mozip-worker:initial

          envFrom:
            - configMapRef:
                name: mozip-config
            - secretRef:
                name: mozip-secret

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
