# 운영 환경 (DB, Redis, JWT_SECRET, CORS_ALLOWED_ORIGINS 등 접속 정보는 환경변수로 주입)
# 인증 우회(auth.bypass)는 이 프로필에서 켤 수 없음 (AuthBypassProperties가 prod를 거부)

springdoc:
  # API 명세와 Swagger UI는 운영에서 노출하지 않음
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  graphql:
    graphiql:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

graphql:
  # 스키마가 밖으로 나가지 않게 introspection 비활성화 (프론트는 빌드 시점에 개발 서버에서 받음)
  introspection-enabled: false
