apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mozip-api-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - api-dev.mo-zip.com
      secretName: mozip-dev-tls

  rules:
    - host: api-dev.mo-zip.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mozip-api
                port:
                  number: 80
