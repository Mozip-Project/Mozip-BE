apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mozip-dev

resources:
- ../../base
- configmap.yaml
- ingress.yaml
- hpa.yaml


patches:
- path: api-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-api
    version: v1
- path: worker-patch.yaml
  target:
    group: apps
    kind: Deployment
    name: mozip-worker
    version: v1
images:
- name: ghcr.io/mozip-project/mozip-api
  newName: ghcr.io/mozip-project/mozip-api
  newTag: be3884327b9adff3eb3a70d7effca8e4b69c0383
- name: ghcr.io/mozip-project/mozip-worker
  newName: ghcr.io/mozip-project/mozip-worker
  newTag: be3884327b9adff3eb3a70d7effca8e4b69c0383
