name: Release

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'k8s/app/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-develop
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew :api:bootJar :worker:bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          OWNER="${REPOSITORY%%/*}"
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${OWNER}/mozip-api" >> "$GITHUB_OUTPUT"
#          echo "worker=ghcr.io/${OWNER}/mozip-worker" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.api }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

#      - name: Docker metadata (Worker)
#        id: meta-worker
#        uses: docker/metadata-action@v5
#        with:
#          images: ${{ steps.images.outputs.worker }}
#          tags: |
#            type=raw,value=${{ github.sha }}
#            type=ref,event=branch
#
#      - name: Build and push Worker
#        uses: docker/build-push-action@v6
#        with:
#          context: .
#          file: ./worker/Dockerfile
#          push: true
#          tags: ${{ steps.meta-worker.outputs.tags }}
#          labels: ${{ steps.meta-worker.outputs.labels }}
#          cache-from: type=gha
#          cache-to: type=gha,mode=max

      - name: Check Kustomize
        run: kustomize version

      - name: Update image tags
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd k8s/app
          kustomize edit set image "${API_IMAGE}=${API_IMAGE}:${IMAGE_TAG}"
          # worker 이미지는 아직 빌드/푸시하지 않으므로 비활성화
          # kustomize edit set image "${WORKER_IMAGE}=${WORKER_IMAGE}:${IMAGE_TAG}"

      - name: Commit manifest update
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/app/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: deploy ${IMAGE_TAG}"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
